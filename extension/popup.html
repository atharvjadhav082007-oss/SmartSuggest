<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSuggest Assistant</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand">
        <div class="logo-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <span class="brand-name">SmartSuggest<span class="brand-accent">.cpp</span></span>
      </div>
      <div class="status-indicator" id="statusBadge">
        <span class="status-dot"></span>
        <span class="status-text" id="statusText">Checking...</span>
      </div>
    </header>

    <div class="quick-check-card">
      <div class="card-label">Quick Email / Text Proofreader:</div>
      <textarea
        id="quickInput"
        rows="4"
        placeholder="Type or paste email draft here (e.g. 'he go to the the meeting and could of brought a apple')..."
      ></textarea>
      <div class="action-row">
        <button type="button" class="btn primary" id="checkBtn">⚡ Proofread</button>
        <button type="button" class="btn secondary" id="copyBtn" disabled>📋 Copy Fixed</button>
      </div>
    </div>

    <div id="resultsBox" class="results-box" style="display: none;">
      <div class="results-meta" id="resultsMeta">0 issues detected</div>
      <div class="issues-list" id="issuesList"></div>
    </div>

    <footer class="popup-footer">
      <span>Auto-activates on Gmail & Outlook compose boxes</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
